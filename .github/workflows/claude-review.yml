      - *clr-step
      - *clr-agent

      # Collect the last agent slot and post the inline comments and the summary comment. !cancelled()
      # instead of always(): when a newer push cancels this run, the partial result must not be posted,
      # because the summary carries the head marker the next incremental review starts from. A failed
      # run still posts. If init never ran, the driver finds no state file and does nothing.
      - name: Claude review driver (report)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLR_INPUT_ENABLE_FIX: ${{ inputs.enable_fix }}
        run: |
          "$CLR_NODE" "$CLR_SRC/.github/claude-review/driver.mjs" report
