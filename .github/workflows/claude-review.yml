name: Claude Review

# Reusable workflow: automated pull request review and fix loop with Claude Code.
# Callers invoke it from a `pull_request` workflow (see README.md).
#
# How it works: everything is decided by code in .github/claude-review/driver.mjs (read from this
# repository at the exact commit of this workflow file). The YAML only repeats
# "driver step, then run the agent if the driver asked for one":
#
#   checkout -> fetch driver -> driver init -> [driver step, agent slot] x 60 -> driver report
#
# - `driver step` collects the result of the previous agent slot, runs the L0 gate (the caller's
#   setup/check/fix commands), commits fixes locally, and writes CLR_NEXT (agent | done) plus the
#   prompt, arguments and timeout of the next slot to $GITHUB_ENV. After `done`, every later step is
#   skipped.
# - Fix commits are pushed by a push slot: a Claude agent slot that pushes the commits. The action
#   authenticates it as the Claude GitHub App (`claude[bot]`) through an OIDC token exchange, so the
#   push triggers the caller's workflows again, which a GITHUB_TOKEN push would not. The job skips
#   runs triggered by `claude[bot]`, so the loop does not review its own pushes.
# - 60 is the driver's slot limit (MAX_SLOTS in lib/state.mjs). Unused slots cost nothing.
# - Only the agent slot sees CLAUDE_CODE_OAUTH_TOKEN and the app token. Only the driver calls see
#   GH_TOKEN (read access to contents, comments and fetches). The caller's commands run inside the
#   driver without any of them.
#
# Runner requirement: `git` and `gh` must be installed in /usr/bin or /usr/local/bin. The driver looks only
# in a fixed system PATH (SYSTEM_PATH in lib/util.mjs), never in the job PATH that L0 commands can change.
# `ubuntu-latest` provides both.
#
# Caller requirement: the caller job must grant `contents: read`, `pull-requests: write`,
# `issues: write` and `id-token: write` (needed for the Claude GitHub App token exchange). The Claude
# GitHub App must be installed on the repository. A called workflow can never exceed the caller's
# permissions.

on:
  workflow_call:
    inputs:
      # Models and effort
      review_model:
        description: "Claude model for the L1 to L3 reviewers (passed as --model)."
        type: string
        required: false
        default: "claude-opus-5-5"
      review_effort:
        description: "Reasoning effort of the reviewers (passed as --effort). Empty omits the flag."
        type: string
        required: false
        default: "high"
      l1_model:
        description: "Model override for the L1 (requirements and correctness) reviewer. Empty uses review_model."
        type: string
        required: false
        default: ""
      l2_model:
        description: "Model override for the L2 (security) reviewer. Empty uses review_model."
        type: string
        required: false
        default: ""
      l3_model:
        description: "Model override for the L3 (architecture) reviewer. Empty uses review_model."
        type: string
        required: false
        default: ""
      fix_model:
        description: "Claude model for the fix agent (passed as --model)."
        type: string
        required: false
        default: "claude-sonnet-5-5"
      fix_effort:
        description: "Reasoning effort of the fix agent (passed as --effort). Empty omits the flag."
        type: string
        required: false
        default: "medium"
      # Deprecated aliases, kept so existing callers keep working.
      model:
        description: "Deprecated: use review_model. When not empty, it replaces review_model."
        type: string
        required: false
        default: ""
      max_turns:
        description: "Deprecated: use review_max_turns. Maximum agent turns per review (passed as --max-turns)."
        type: number
        required: false
        default: 30
      # Limits
      review_max_turns:
        description: "Maximum agent turns per review (passed as --max-turns). 0 uses max_turns."
        type: number
        required: false
        default: 0
      fix_max_turns:
        description: "Maximum agent turns per fix (passed as --max-turns)."
        type: number
        required: false
        default: 40
      max_fix_rounds:
        description: "Maximum fix rounds for L0 and for each review layer. After the limit, the remaining layers are reviewed once without fixes."
        type: number
        required: false
        default: 3
      timeout_minutes:
        description: "Job timeout in minutes. The driver also plans its remaining work from this value."
        type: number
        required: false
        default: 120
      agent_step_timeout_minutes:
        description: "Default timeout of one agent slot in minutes. The driver sets the timeout per slot (CLR_STEP_TIMEOUT): a fix slot is started only with 35 minutes of job time left, and a push slot gets a 5 minute timeout. Keep it below 25, the time the driver needs left to start a slot."
        type: number
        required: false
        default: 20
      # Repository commands (run by the driver, without tokens)
      setup_command:
        description: "Shell command that prepares the checkout (install dependencies and tools) before the checks. Runs once, only when checks run. Must come from the caller's own trusted workflow file."
        type: string
        required: false
        default: ""
      check_commands:
        description: "Lint, format, type and test commands, one per line (blank lines and lines starting with # are ignored). Each runs with `bash -eo pipefail -c`. Empty skips the L0 gate. Must come from the caller's own trusted workflow file."
        type: string
        required: false
        default: ""
      fix_command:
        description: "Command that fixes check failures automatically, for example a formatter. Its changes are committed and pushed. Empty skips it. Must come from the caller's own trusted workflow file."
        type: string
        required: false
        default: ""
      enable_fix:
        description: "Let the loop push fix commits (fix_command and the fix agent). When false, the run only reviews."
        type: boolean
        required: false
        default: true
      # Prompt and access
      extra_prompt:
        description: "Repository-specific review instructions appended to the prompt. Must come from the caller's own trusted workflow file."
        type: string
        required: false
        default: ""
      allowed_bots:
        description: "Bot actors allowed to trigger a review (comma-separated names or '*'). The action rejects bot actors, such as bot pushes, unless they are listed."
        type: string
        required: false
        default: "*"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token from `claude setup-token`."
        required: true

jobs:
  review:
    name: Claude Review
    # Only same-repository, non-draft pull_request events. Fork PRs are skipped
    # because they do not receive secrets. Bot authors and other bots' pushes are NOT skipped, but
    # runs triggered by claude[bot] are: those are the push slot's own commits, already reviewed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.triggering_actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # contents: read is enough for the driver (checkout and fetch). Pushes to the PR branch are made
    # by the push slot with the Claude GitHub App token, not with this job's token.
    # id-token: write lets the action exchange the OIDC token for that app token (no github_token input).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # actions/checkout v6.1.0
      # persist-credentials is off: the driver passes the token to git itself, only for fetch.
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history so that `git diff <last reviewed> <head>` works for incremental reviews.
          fetch-depth: 0
          persist-credentials: false

      # Get the driver from the commit of this workflow file, so a caller pinned to a tag or SHA gets
      # the matching driver. Runs outside the workspace, so the pull request cannot replace it.
      # `node` is resolved now, before any repository command runs, and used by its absolute path.
      - name: Fetch review driver
        env:
          SRC_REPO: ${{ job.workflow_repository }}
          SRC_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SRC_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::Unexpected workflow repository: $SRC_REPO"; exit 1; }
          [[ "$SRC_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected workflow commit: $SRC_SHA"; exit 1; }
          src="$RUNNER_TEMP/claude-review-src"
          rm -rf "$src"
          mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$SRC_REPO.git" "$SRC_SHA" \
            || { echo "::error::Could not fetch $SRC_REPO@$SRC_SHA. The repository that holds this workflow must be readable without a token."; exit 1; }
          git -C "$src" checkout -q --detach FETCH_HEAD
          got=$(git -C "$src" rev-parse HEAD)
          [ "$got" = "$SRC_SHA" ] || { echo "::error::Fetched $got, expected $SRC_SHA"; exit 1; }
          test -f "$src/.github/claude-review/driver.mjs"
          {
            echo "CLR_SRC=$src"
            echo "CLR_NODE=$(command -v node)"
          } >> "$GITHUB_ENV"
          echo "Driver from $SRC_REPO@$SRC_SHA"

      # The driver plans the remaining job time from this value (epoch seconds).
      - name: Record job start
        run: echo "CLR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # init reads every CLR_INPUT_* value once and stores it in the driver's state file; later calls
      # need only the token. The setup, check and fix commands run inside the driver (L0), with a
      # sanitized environment: no secrets, no workflow command files.
      # Inputs go through env, never into a script body.
      - name: Claude review driver (init)
        env:
          GH_TOKEN: ${{ github.token }}
          CLR_INPUT_REVIEW_MODEL: ${{ inputs.model != '' && inputs.model || inputs.review_model }}
          CLR_INPUT_REVIEW_EFFORT: ${{ inputs.review_effort }}
          CLR_INPUT_L1_MODEL: ${{ inputs.l1_model }}
          CLR_INPUT_L2_MODEL: ${{ inputs.l2_model }}
          CLR_INPUT_L3_MODEL: ${{ inputs.l3_model }}
          CLR_INPUT_FIX_MODEL: ${{ inputs.fix_model }}
          CLR_INPUT_FIX_EFFORT: ${{ inputs.fix_effort }}
          CLR_INPUT_MAX_TURNS: ${{ inputs.review_max_turns > 0 && inputs.review_max_turns || inputs.max_turns }}
          CLR_INPUT_FIX_MAX_TURNS: ${{ inputs.fix_max_turns }}
          CLR_INPUT_ENABLE_FIX: ${{ inputs.enable_fix }}
          CLR_INPUT_MAX_FIX_ROUNDS: ${{ inputs.max_fix_rounds }}
          CLR_INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          CLR_INPUT_AGENT_STEP_TIMEOUT_MINUTES: ${{ inputs.agent_step_timeout_minutes }}
          CLR_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CLR_INPUT_EXTRA_PROMPT: ${{ inputs.extra_prompt }}
          CLR_INPUT_ALLOWED_BOTS: ${{ inputs.allowed_bots }}
          CLR_INPUT_SETUP_COMMAND: ${{ inputs.setup_command }}
          CLR_INPUT_CHECK_COMMANDS: ${{ inputs.check_commands }}
          CLR_INPUT_FIX_COMMAND: ${{ inputs.fix_command }}
        run: |
          "$CLR_NODE" "$CLR_SRC/.github/claude-review/driver.mjs" init

      # Agent slots. Each pair below is: collect the last result and prepare the next slot, then run the
      # agent when the driver asked for one. The first pair is written out; the other 59 are YAML
      # aliases of it (GitHub Actions supports anchors). If the driver step itself fails, CLR_NEXT is set
      # to done so no later slot runs on stale input; the report step still runs.
      - &clr-step
        name: Claude review driver (step)
        if: ${{ !cancelled() && env.CLR_NEXT != 'done' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLR_INPUT_ENABLE_FIX: ${{ inputs.enable_fix }}
        run: |
          "$CLR_NODE" "$CLR_SRC/.github/claude-review/driver.mjs" step || { echo "CLR_NEXT=done" >> "$GITHUB_ENV"; exit 1; }
      # continue-on-error: a failed or timed-out agent is recorded by the next driver step as an
      # incomplete review, never as a pass. The OAuth token is passed only here. The timeout comes
      # from the driver per slot (CLR_STEP_TIMEOUT, minutes); the input is the fallback.
      - &clr-agent
        name: Claude agent
        if: ${{ env.CLR_NEXT == 'agent' && !cancelled() }}
        continue-on-error: true
        timeout-minutes: ${{ env.CLR_STEP_TIMEOUT != '' && fromJSON(env.CLR_STEP_TIMEOUT) || inputs.agent_step_timeout_minutes }}
        # anthropics/claude-code-action v1.0.269
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          prompt: ${{ env.CLR_PROMPT }}
          claude_args: ${{ env.CLR_ARGS }}
          path_to_claude_code_executable: ${{ env.CLR_CLAUDE_BIN }}
          path_to_bun_executable: ${{ env.CLR_BUN_BIN }}
          # The driver reads the structured output and posts comments itself.
          classify_inline_comments: 'false'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
      - *clr-agent
      - *clr-step
